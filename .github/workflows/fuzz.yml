name: Fuzz URDF parser

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  fuzz:
    name: Atheris fuzzing (time-boxed)
    runs-on: ubuntu-latest
    # Advisory only: a fuzzing finding should not block merges. Findings
    # are triaged from the job log and filed as issues.
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install atheris and package
        run: |
          python -m pip install --upgrade pip
          pip install atheris==3.0.0
          pip install -e .

      - name: Fuzz URDF parser for 60 seconds
        # First dir is the writable corpus; the fixtures are read-only seeds.
        run: |
          mkdir -p /tmp/fuzz-corpus
          python fuzz/fuzz_urdf.py -max_total_time=60 /tmp/fuzz-corpus tests/urdf_fixtures/
