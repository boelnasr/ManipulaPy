name: Post coverage comment

# zizmor: ignore[dangerous-triggers] We're using workflow_run to post a coverage
# comment on external PRs. This is safe because we don't checkout the external
# code or interact with it in any way beyond extracting an artifact containing
# the comment to post, and posting it.
on:
  workflow_run:
    workflows: ["CI Tests"]
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  post:
    name: Post coverage comment
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      pull-requests: write # Post the comment, and edit it on later runs
      actions: read # Download the comment artifact from the triggering CI run
      contents: read
    steps:
      # DO NOT run actions/checkout here, for security reasons.
      # See https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
      - name: Post comment
        uses: py-cov-action/python-coverage-comment-action@a05be3d2e8a6272d3ef5fb2840ab20368bb2eb71 # v4.3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PR_RUN_ID: ${{ github.event.workflow_run.id }}
