name: GPU Release Gate

# Requires that the exact commit being released has a successful
# `gpu-axes-passed` check-run, i.e. that cupy-gpu, torch-cuda and jax-cuda all
# ran on live hardware for this SHA. Called by publish.yml and tpu-release.yml
# so both gates read the same evidence.

on:
  workflow_call:

permissions:
  checks: read
  contents: read

jobs:
  gpu-release-gate:
    name: Require live GPU evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require gpu-axes-passed for the exact commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          count="$(curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            | jq '[.check_runs[] | select(.name == "gpu-axes-passed" and .conclusion == "success")] | length')"
          test "$count" -ge 1
          echo "Found live gpu-axes-passed evidence for ${GITHUB_SHA}"
