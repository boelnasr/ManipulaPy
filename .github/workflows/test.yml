name: CI Tests

on:
  push:
    branches: [main, develop, release/v1.4]
    tags: ["v1.4.*"]
  pull_request:
    branches: [main, develop, release/v1.4]

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  NUMBA_DISABLE_CUDA: "1"

jobs:
  backend-cpu:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: numpy-cpu
            backend: numpy
            extra: ""
          - name: torch-cpu
            backend: torch
            extra: ",pytorch"
          - name: jax-cpu
            backend: jax
            extra: ",jax-cpu"
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install backend and test dependencies
        run: python -m pip install -e ".[dev${{ matrix.extra }}]"

      - name: Assert hosted CPU device
        env:
          BACKEND: ${{ matrix.backend }}
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "1"
        run: |
          python - <<'PY'
          import os
          backend = os.environ["BACKEND"]
          if backend == "numpy":
              from ManipulaPy.backend import get_backend
              assert type(get_backend()).__name__ == "NumpyBackend"
          elif backend == "torch":
              import torch
              from ManipulaPy.backend.torch_backend import TorchBackend
              value = TorchBackend().to_device([1.0])
              assert value.device.type == "cpu"
          else:
              import jax
              devices = jax.devices()
              assert devices and all(device.platform == "cpu" for device in devices)
          print(f"{backend} hosted CPU assertion passed")
          PY

      - name: Run public API freeze
        run: python -m pytest tests/test_public_api_freeze.py -q

      - name: Run NumPy backend contracts
        if: matrix.backend == 'numpy'
        run: |
          python -m pytest tests/test_backend_dispatch.py \
            -k "not (torch or jax or cupy)" -q

      - name: Run Torch CPU and gradient contracts
        if: matrix.backend == 'torch'
        run: |
          python -m pytest tests/test_backend_dispatch.py tests/test_torch_call_sites.py \
            -k torch -q
          python -m pytest tests/test_gradient_contract.py -k torch -q

      - name: Run JAX CPU and gradient contracts
        if: matrix.backend == 'jax'
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "1"
        run: |
          python -m pytest tests/test_backend_dispatch.py tests/test_jax_call_sites.py \
            -k jax -q
          python -m pytest tests/test_gradient_contract.py -k jax -q

  non-tpu-regression:
    name: non-tpu-regression (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # tests/test_docs_design.py builds the docs with Sphinx, so the docs extra
      # has to be present for that contract to run rather than fail. Sphinx 8
      # requires Python >= 3.10, so 3.9 installs the base set and the one
      # Sphinx-invoking test skips there.
      - name: Install regression dependencies
        run: |
          if python -c "import sys; sys.exit(0 if sys.version_info >= (3, 10) else 1)"; then
            # nbsphinx shells out to pandoc to convert the notebooks' markdown
            # cells. It is a system binary, not a wheel, so installing the docs
            # extra alone leaves the build failing with PandocMissing.
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends pandoc
            python -m pip install -e ".[dev,docs]"
          else
            python -m pip install -e ".[dev]"
          fi
      - name: Run the complete non-TPU regression suite
        run: |
          python -m pytest tests --ignore=tests/test_tpu_contract.py \
            -m "not (tpu or cuda or gpu or vision or simulation)" -q

  cupy-gpu:
    name: cupy-gpu
    if: >-
      vars.GPU_RUNNER_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, gpu]
    timeout-minutes: 45
    env:
      NUMBA_DISABLE_CUDA: "0"
      MANIPULAPY_FORCE_CPU: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install CuPy backend
        run: python -m pip install -e ".[dev,cuda]"
      - name: Assert a live CUDA device
        run: |
          python - <<'PY'
          import cupy as cp
          assert cp.cuda.runtime.getDeviceCount() > 0
          value = cp.matmul(cp.eye(2), cp.ones((2, 1)))
          value.data.mem.device.synchronize()
          assert isinstance(value, cp.ndarray)
          print(cp.cuda.runtime.getDeviceProperties(0)["name"])
          PY
      - name: Run public API freeze
        run: python -m pytest tests/test_public_api_freeze.py -q
      - name: Run CuPy and CUDA contracts without skips
        run: |
          python -m pytest tests/test_backend_dispatch.py -k cupy \
            --junitxml=cupy-backend.xml -q
          python scripts/assert_junit_no_skips.py cupy-backend.xml
          python -m pytest tests/test_cuda_kernels.py --junitxml=cupy-gpu.xml -q
          python scripts/assert_junit_no_skips.py cupy-gpu.xml

  torch-cuda:
    name: torch-cuda
    if: >-
      vars.GPU_RUNNER_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, gpu]
    timeout-minutes: 45
    env:
      NUMBA_DISABLE_CUDA: "0"
      MANIPULAPY_FORCE_CPU: "0"
      # TorchBackend defaults to CPU and the registry never overwrites a name,
      # so without this the contracts below would run on CPU while still
      # feeding gpu-axes-passed. conftest binds the backend to this device and
      # fails the job if CUDA is unavailable.
      MANIPULAPY_TEST_TORCH_DEVICE: cuda
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Torch backend
        run: python -m pip install -e ".[dev,pytorch]"
      - name: Assert Torch core math on a live CUDA device
        run: |
          python - <<'PY'
          import numpy as np
          import torch
          from ManipulaPy.backend import register, set_backend
          from ManipulaPy.backend.torch_backend import TorchBackend
          from ManipulaPy.kinematics import SerialManipulator

          assert torch.cuda.is_available()
          cuda_backend = TorchBackend(device="cuda")
          register("torch-cuda", cuda_backend)
          set_backend("torch-cuda")
          screws = np.array([
              [0., 0., 1., 0., 0., 0.],
              [0., 1., 0., -.3, 0., .2],
          ]).T
          robot = SerialManipulator(
              np.eye(4), screws[:3], S_list=screws, B_list=screws.copy()
          )
          fk = robot.forward_kinematics([.2, -.3])
          jacobian = robot.jacobian([.2, -.3])
          torch.cuda.synchronize()
          assert fk.device.type == jacobian.device.type == "cuda"
          assert torch.isfinite(fk).all() and torch.isfinite(jacobian).all()
          print(torch.cuda.get_device_name(0))
          PY
      - name: Run public API freeze
        run: python -m pytest tests/test_public_api_freeze.py -q
      - name: Run Torch and gradient contracts without skips
        run: |
          python -m pytest tests/test_torch_call_sites.py tests/test_gradient_contract.py \
            -k torch --junitxml=torch-cuda.xml -q
          python scripts/assert_junit_no_skips.py torch-cuda.xml

  jax-cuda:
    name: jax-cuda
    if: >-
      vars.GPU_RUNNER_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, gpu]
    timeout-minutes: 45
    env:
      JAX_PLATFORMS: cuda
      JAX_ENABLE_X64: "1"
      NUMBA_DISABLE_CUDA: "0"
      MANIPULAPY_FORCE_CPU: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install JAX CUDA backend
        run: python -m pip install -e ".[dev,jax-cuda]"
      - name: Assert JAX core math on a live CUDA device
        run: |
          python - <<'PY'
          import jax
          import jax.numpy as jnp
          devices = jax.devices()
          assert devices and all(device.platform == "gpu" for device in devices)
          result = jax.jit(lambda x: x @ x)(jnp.eye(3, dtype=jnp.float64))
          result.block_until_ready()
          assert result.device.platform == "gpu"
          print(devices)
          PY
      - name: Run public API freeze
        run: python -m pytest tests/test_public_api_freeze.py -q
      - name: Run JAX and gradient contracts without skips
        run: |
          python -m pytest tests/test_jax_call_sites.py tests/test_gradient_contract.py \
            -k jax --junitxml=jax-cuda.xml -q
          python scripts/assert_junit_no_skips.py jax-cuda.xml

  # OpenCV, scikit-learn and PyBullet are in no hosted job's install, so 13
  # tests that need the real libraries skip everywhere and contribute nothing.
  # Nine of them are the URDF-vs-PyBullet kinematics cross-checks, which are an
  # independent oracle for the headline math. The self-hosted runner has the
  # real libraries, so run them there. Deliberately NOT part of gpu-axes-passed:
  # that marker gates the release on CUDA correctness and must not start
  # depending on optional CPU libraries.
  optional-deps:
    name: optional-deps
    if: >-
      vars.GPU_RUNNER_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, gpu]
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the optional runtime dependencies
        run: python -m pip install -e ".[dev,vision,ml,simulation,urdf]"
      - name: Assert the real libraries are importable, not stand-ins
        run: |
          python - <<'PY'
          import types
          import cv2, sklearn.cluster, pybullet
          for module in (cv2, sklearn.cluster, pybullet):
              assert isinstance(module, types.ModuleType), module
          print(f"cv2 {cv2.__version__}, sklearn {sklearn.__version__}")
          PY
      - name: Run the suites that need the real libraries
        run: |
          python -m pytest tests/test_urdf_accuracy.py tests/test_vision.py \
            tests/test_perception.py --junitxml=optional-deps.xml -q
      - name: Refuse a run where a dependency was missing
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          # A no-skips gate is wrong here: two vision tests skip on genuine
          # PyBullet runtime conditions. Only dependency-shaped skips mean the
          # job silently tested nothing.
          markers = ("not available", "not installed", "No module named")
          root = ET.parse("optional-deps.xml").getroot()
          offenders = [
              f"{case.get('classname')}.{case.get('name')}: {skip.get('message', '')}"
              for case in root.iter("testcase")
              for skip in case.findall("skipped")
              if any(marker in (skip.get("message") or "") for marker in markers)
          ]
          if offenders:
              print("dependency-gated skips on a runner that should have them:")
              print("\n".join(offenders))
              sys.exit(1)
          print("no dependency-gated skips")
          PY

  build-check:
    name: build-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip==26.0.1 build==1.4.4 wheel==0.47.0
          pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Build and inspect package
        run: |
          python -m build
          python scripts/check_sdist_tracked.py dist/*.tar.gz
          python -m pip install dist/*.whl
          python -c "import ManipulaPy; print(ManipulaPy.__version__)"
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-packages
          path: dist/
          retention-days: 7

  gpu-axes-passed:
    name: gpu-axes-passed
    needs: [cupy-gpu, torch-cuda, jax-cuda]
    if: >-
      always() && vars.GPU_RUNNER_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Require every live CUDA axis
        env:
          CUPY_RESULT: ${{ needs.cupy-gpu.result }}
          TORCH_RESULT: ${{ needs.torch-cuda.result }}
          JAX_RESULT: ${{ needs.jax-cuda.result }}
        run: |
          test "$CUPY_RESULT" = success
          test "$TORCH_RESULT" = success
          test "$JAX_RESULT" = success
          echo "All live GPU axes passed for ${GITHUB_SHA}"
