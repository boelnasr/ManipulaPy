name: CI Tests

on:
  push:
    branches: [main, develop, release/v1.4]
    tags: ["v1.4.*"]
  pull_request:
    branches: [main, develop, release/v1.4]

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  NUMBA_DISABLE_CUDA: "1"

jobs:
  backend-cpu:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: numpy-cpu
            backend: numpy
            extra: ""
          - name: torch-cpu
            backend: torch
            extra: ",pytorch"
          - name: jax-cpu
            backend: jax
            extra: ",jax-cpu"
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install backend and test dependencies
        run: python -m pip install -e ".[dev${{ matrix.extra }}]"

      - name: Assert hosted CPU device
        env:
          BACKEND: ${{ matrix.backend }}
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "1"
        run: |
          python - <<'PY'
          import os
          backend = os.environ["BACKEND"]
          if backend == "numpy":
              from ManipulaPy.backend import get_backend
              assert type(get_backend()).__name__ == "NumpyBackend"
          elif backend == "torch":
              import torch
              from ManipulaPy.backend.torch_backend import TorchBackend
              value = TorchBackend().to_device([1.0])
              assert value.device.type == "cpu"
          else:
              import jax
              devices = jax.devices()
              assert devices and all(device.platform == "cpu" for device in devices)
          print(f"{backend} hosted CPU assertion passed")
          PY

      - name: Run public API freeze
        run: python -m pytest tests/test_public_api_freeze.py -q

      - name: Run NumPy backend contracts
        if: matrix.backend == 'numpy'
        run: |
          python -m pytest tests/test_backend_dispatch.py \
            -k "not (torch or jax or cupy)" -q

      - name: Run Torch CPU and gradient contracts
        if: matrix.backend == 'torch'
        run: |
          python -m pytest tests/test_backend_dispatch.py tests/test_torch_call_sites.py \
            -k torch -q
          python -m pytest tests/test_gradient_contract.py -k torch -q

      - name: Run JAX CPU and gradient contracts
        if: matrix.backend == 'jax'
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "1"
        run: |
          python -m pytest tests/test_backend_dispatch.py tests/test_jax_call_sites.py \
            -k jax -q
          python -m pytest tests/test_gradient_contract.py -k jax -q

  non-tpu-regression:
    name: non-tpu-regression (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install regression dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run the complete non-TPU regression suite
        run: python -m pytest tests -m "not tpu" -q

  cupy-gpu:
    name: cupy-gpu
    if: >-
      vars.GPU_RUNNER_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, gpu]
    timeout-minutes: 45
    env:
      NUMBA_DISABLE_CUDA: "0"
      MANIPULAPY_FORCE_CPU: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install CuPy backend
        run: python -m pip install -e ".[dev,cuda]"
      - name: Assert a live CUDA device
        run: |
          python - <<'PY'
          import cupy as cp
          assert cp.cuda.runtime.getDeviceCount() > 0
          value = cp.matmul(cp.eye(2), cp.ones((2, 1)))
          value.data.mem.device.synchronize()
          assert isinstance(value, cp.ndarray)
          print(cp.cuda.runtime.getDeviceProperties(0)["name"])
          PY
      - name: Run public API freeze
        run: python -m pytest tests/test_public_api_freeze.py -q
      - name: Run CuPy and CUDA contracts without skips
        run: |
          python -m pytest tests/test_backend_dispatch.py -k cupy \
            --junitxml=cupy-backend.xml -q
          python scripts/assert_junit_no_skips.py cupy-backend.xml
          python -m pytest tests/test_cuda_kernels.py --junitxml=cupy-gpu.xml -q
          python scripts/assert_junit_no_skips.py cupy-gpu.xml

  torch-cuda:
    name: torch-cuda
    if: >-
      vars.GPU_RUNNER_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, gpu]
    timeout-minutes: 45
    env:
      NUMBA_DISABLE_CUDA: "0"
      MANIPULAPY_FORCE_CPU: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install Torch backend
        run: python -m pip install -e ".[dev,pytorch]"
      - name: Assert Torch core math on a live CUDA device
        run: |
          python - <<'PY'
          import numpy as np
          import torch
          from ManipulaPy.backend import register, set_backend
          from ManipulaPy.backend.torch_backend import TorchBackend
          from ManipulaPy.kinematics import SerialManipulator

          assert torch.cuda.is_available()
          cuda_backend = TorchBackend(device="cuda")
          register("torch-cuda", cuda_backend)
          set_backend("torch-cuda")
          screws = np.array([
              [0., 0., 1., 0., 0., 0.],
              [0., 1., 0., -.3, 0., .2],
          ]).T
          robot = SerialManipulator(
              np.eye(4), screws[:3], S_list=screws, B_list=screws.copy()
          )
          fk = robot.forward_kinematics([.2, -.3])
          jacobian = robot.jacobian([.2, -.3])
          torch.cuda.synchronize()
          assert fk.device.type == jacobian.device.type == "cuda"
          assert torch.isfinite(fk).all() and torch.isfinite(jacobian).all()
          print(torch.cuda.get_device_name(0))
          PY
      - name: Run public API freeze
        run: python -m pytest tests/test_public_api_freeze.py -q
      - name: Run Torch and gradient contracts without skips
        run: |
          python -m pytest tests/test_torch_call_sites.py tests/test_gradient_contract.py \
            -k torch --junitxml=torch-cuda.xml -q
          python scripts/assert_junit_no_skips.py torch-cuda.xml

  jax-cuda:
    name: jax-cuda
    if: >-
      vars.GPU_RUNNER_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, gpu]
    timeout-minutes: 45
    env:
      JAX_PLATFORMS: cuda
      JAX_ENABLE_X64: "1"
      NUMBA_DISABLE_CUDA: "0"
      MANIPULAPY_FORCE_CPU: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install JAX CUDA backend
        run: python -m pip install -e ".[dev,jax-cuda]"
      - name: Assert JAX core math on a live CUDA device
        run: |
          python - <<'PY'
          import jax
          import jax.numpy as jnp
          devices = jax.devices()
          assert devices and all(device.platform == "gpu" for device in devices)
          result = jax.jit(lambda x: x @ x)(jnp.eye(3, dtype=jnp.float64))
          result.block_until_ready()
          assert result.device.platform == "gpu"
          print(devices)
          PY
      - name: Run public API freeze
        run: python -m pytest tests/test_public_api_freeze.py -q
      - name: Run JAX and gradient contracts without skips
        run: |
          python -m pytest tests/test_jax_call_sites.py tests/test_gradient_contract.py \
            -k jax --junitxml=jax-cuda.xml -q
          python scripts/assert_junit_no_skips.py jax-cuda.xml

  build-check:
    name: build-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.9"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip==26.0.1 build==1.4.4 wheel==0.47.0
          pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Build and inspect package
        run: |
          python -m build
          python scripts/check_sdist_tracked.py dist/*.tar.gz
          python -m pip install dist/*.whl
          python -c "import ManipulaPy; print(ManipulaPy.__version__)"
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-packages
          path: dist/
          retention-days: 7

  gpu-axes-passed:
    name: gpu-axes-passed
    needs: [cupy-gpu, torch-cuda, jax-cuda]
    if: >-
      always() && vars.GPU_RUNNER_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Require every live CUDA axis
        env:
          CUPY_RESULT: ${{ needs.cupy-gpu.result }}
          TORCH_RESULT: ${{ needs.torch-cuda.result }}
          JAX_RESULT: ${{ needs.jax-cuda.result }}
        run: |
          test "$CUPY_RESULT" = success
          test "$TORCH_RESULT" = success
          test "$JAX_RESULT" = success
          echo "All live GPU axes passed for ${GITHUB_SHA}"
