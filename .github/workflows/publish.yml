name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip==26.1.2 build==1.5.0

      - name: Install PyTorch (build dependency)
        run: |
          pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Build sdist and wheel
        run: python -m build

      # The sdist is assembled from the working tree, not from git, so any
      # untracked file matching a MANIFEST.in include is published. This is the
      # last gate before an artifact leaves for PyPI: refuse to publish one
      # containing anything git does not track.
      - name: Assert the sdist contains only tracked files
        run: python scripts/check_sdist_tracked.py dist/*.tar.gz

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # The TPU contract (tpu-release.yml) is deliberately not wired in: TPUs are
  # not a supported target — XLA:TPU has no float64 LU decomposition, and this
  # backend is float64-only — so there is no TPU extra and nothing to gate on.
  # Publishing requires live GPU evidence. If TPU support is ever built, swap
  # this job to `uses: ./.github/workflows/tpu-release.yml` (which calls the
  # same GPU gate itself) and grant it `id-token: write`.
  gpu-release-gate:
    name: GPU release gate
    uses: ./.github/workflows/gpu-release-gate.yml
    permissions:
      checks: read
      contents: read

  publish:
    name: Publish to PyPI
    needs: [build, gpu-release-gate]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ManipulaPy/
    permissions:
      id-token: write  # OIDC token for Trusted Publishing — no API token needed
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
